      provisioner: rancher.io/local-path
      storageClass: standard

  elasticsearch:
    enabled: true
    image:
      repository: bitnamilegacy/elasticsearch
      tag: 8.18.0
    nodeGroup: master
    master:
      resources:
        requests:
          cpu: 1
          memory: 2048Mi
        limits:
          cpu: 1
          memory: 2048Mi

  design:
    enabled: true
    contextPath: /design
    envVariables:
      application.design.security.type: basic
      server.contextPath: /design
