global:
  security:
    allowInsecureImages: true

openldap:
  enabled: false
  replicas: 1
  service:
    name: openldap
    organization: Flowable Global Sales
    domain: global-sales.flowable.com
    adminPassword: test
  storage:
    provisioner: rancher.io/local-path
    size: 3Gi
    # Comment-out the following 2 lines in case you want bock instead of NFS
    storageClass: standard
    accessModes: ReadWriteOnce
  image:
    repository: osixia/openldap
    pullPolicy:
    tag: 1.5.0
#    secret: gitlab-regcred
  resources:
    requests:
      cpu: "10m"
      memory: "50Mi"
    limits:
      cpu: "40m"
      memory: "100Mi"

keycloak:
  enabled: false
  replicas: 1
  domainName: login
  host: friendly-spoon-jxgqqj6r7jqc5gp7-443.app.github.dev
  database:
   name: keycloak
  service:
   name: keycloak
  image:
   repository: "localhost:5001/keycloak-global-sales"
   pullPolicy:
   tag: "12.0.4"
 #    secret: gitlab-regcred
  resources:
    requests:
      cpu: 100m
      memory: 700Mi
    limits:
      cpu: 200m
      memory: 1200Mi

flowable:
  ingress:
    #     # Enable/disbale the ingress configuration for the Helm chart.
    enabled: false
    # Define mapping type; 'host' for domain name mapping or 'path' for path name mapping
    mappingType: path
    # Define if https should be used to access the service urls (this is highly suggested)
    tls: false
  #  certManagerClusterIssuer: letsencrypt
    # Ingress proxy settings in case of custom frontend (CORS)
    allowOriginEnabled: true
    upgradeHttpConnection: false
    allowOriginUrl: "*"
    bodySize: "20m"
    ingressClass: nginx
    domain: friendly-spoon-jxgqqj6r7jqc5gp7-443.app.github.dev
    hostOverride: friendly-spoon-jxgqqj6r7jqc5gp7-443.app.github.dev
    management:
      expose: false
    # Define a hostname override <service>.<hostOverride> instead of the default <service>.<release>.<domain>
    # hostOverride: staging.flowable.com
    annotations:
    # custom-annotation1: val1

  postgres:
    enabled: true
    image:
      repository: bitnamilegacy/postgresql
      tag: 17.5.0
    service:
      name: postgres
    envVariables:
      POSTGRES_MULTIPLE_DATABASES: "keycloak,internal"
    primary:
      extraEnvVars:
        - name: POSTGRESQL_MAX_CONNECTIONS
          value: "400"
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
  engage:
    enabled: false

  work:
    enabled: true
    image:
  #    repository: localhost:5001/myflowable
      # tag: latest
      tag: 2025.1.01
    resources:
      requests:
        cpu: "100m"
        memory: "1.5Gi"
      limits:
        cpu: "1000m"
        memory: "1.5Gi"
    replicas: 1 # multi-node deployment
    metrics:
      enabled: true
    javaOpts: "-XX:InitialRAMPercentage=70.0 -XX:MaxRAMPercentage=70.0 -XX:MinRAMPercentage=70.0"
    contextPath: /work
    management:
      enabled: true
    envVariables:
      server.contextPath: /work
      flowable.inspect.enabled: "true"
      flowable.platform.enable-audit-log: "true"
      management.elastic.metrics.export.enabled: "false"
      flowable.indexing.enabled: "true"
      application.security.type: basic
