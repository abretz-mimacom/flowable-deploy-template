global:
  security:
    allowInsecureImages: true
flowable:
  ingress:
    # Leave disabled to define our own ingress in templates/
    enabled: false
  postgres:
    enabled: true
    image:
      repository: bitnamilegacy/postgresql
      tag: 17.5.0
    service:
      name: postgres
    envVariables:
      POSTGRES_MULTIPLE_DATABASES: "keycloak,internal"
    primary:
      extraEnvVars:
        - name: POSTGRESQL_MAX_CONNECTIONS
          value: "400"
  engage:
    enabled: false
  work:
    enabled: true
    image:
      #    repository: localhost:5001/myflowable
      # tag: latest
      tag: 2025.2.03
    replicas: 1 # multi-node deployment
    metrics:
      enabled: true
    javaOpts: "-XX:InitialRAMPercentage=70.0 -XX:MaxRAMPercentage=70.0 -XX:MinRAMPercentage=70.0"
    contextPath: /work
    management:
      enabled: true
    envVariables:
      server.contextPath: /work
      server.tomcat.redirect-context-root: false
      server.forward-headers-strategy: framework
      flowable.inspect.enabled: "true"
      flowable.platform.enable-audit-log: "true"
      management.elastic.metrics.export.enabled: "false"
      flowable.indexing.enabled: "true"
      application.security.type: oauth2
      # spring.security.oauth2.client.registration.github.provider: github
      spring.security.oauth2.client.registration.github.client-id: ${GITHUB_OAUTH_CLIENT_ID}
      spring.security.oauth2.client.registration.github.client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
      spring.security.oauth2.client.registration.github.client-name: stg-flowable
      # spring.security.oauth2.client.registration.github.authorization-grant-type: session_code
      spring.security.oauth2.client.registration.github.scope: "read:user,user:email"
      spring.security.oauth2.client.registration.github.redirect-uri: https://ominous-halibut-wrxpjwg9xp6f5965-443.app.github.dev/work/login/oauth2/code/github
      # spring.security.oauth2.client.provider.github.issuer-uri: https://github.com/login/oauth/access_token
      # spring.security.oauth2.client.provider.github.user-name-attribute: email
      flowable.security.oauth2.post-logout-redirect-url: https://ominous-halibut-wrxpjwg9xp6f5965-443.app.github.dev/work/
      flowable.security.oauth2.client.mapper.default-user-definition-key: user-admin
      flowable.security.basic-auth.enabled: "true"
      flowable.security.basic-auth.username: admin
      flowable.security.basic-auth.password: ${GITHUB_OAUTH_CLIENT_SECRET}
      flowable.security.basic-auth.granted-authorities: USER_DEFINITION_KEY_user-admin,GROUP_flowableAdministrator
      logging.level.org.springframework.security: DEBUG
    envSecrets:
      - name: GITHUB_OAUTH_CLIENT_ID
        secretName: flowable-github-oauth
        secretKey: clientId
      - name: GITHUB_OAUTH_CLIENT_SECRET
        secretName: flowable-github-oauth
        secretKey: clientSecret
        # extraVolumes:
        #   - name: additional-classpath
        #     hostPath:
        #       path: /Users/aaron.bretz/.m2/repository/org/flowable/jobapplication/0.0.1-SNAPSHOT/
        #       type: Directory
        # extraVolumeMounts:
        #   - name: additional-classpath
        #     mountPath: /additional-classpath/
        # initContainers:
        #   - name: copy-jar
        #     image: busybox
        #     command: ["sh", "-c", "cp /jars/my-lib.jar /additional-classpath/"]
        #     volumeMounts:
        #       - name: additional-classpath
        #         mountPath: /additonal-classpath
        #       - name: jar-source
        #         mountPath:
        #     volumeMounts:
        #       - name: additional-classpath
        #         mountPath: /additional-classpath/
        # extraImagePullSecrets: flw-docker-auth
    storage:
      provisioner: rancher.io/local-path
      storageClass: standard
  elasticsearch:
    enabled: true
    image:
      repository: bitnamilegacy/elasticsearch
      tag: 8.18.0
    nodeGroup: master
    master:
      resources:
        requests:
          cpu: 250m
          memory: 1024Mi
        limits:
          cpu: 500m
          memory: 2048Mi
  design:
    enabled: false
  control:
    enabled: true
    image:
      # tag: latest
      tag: 2025.2.03
    contextPath: /control
    envVariables:
      flowable.control.app.security.type: basic
      flowable.control.app.cluster-config.password: ${GITHUB_OAUTH_CLIENT_SECRET}
      server.contextPath: /control
      flowable.control.app.cluster-config.authentication-type: basic
    envSecrets:
      - name: GITHUB_OAUTH_CLIENT_SECRET
        secretName: flowable-github-oauth
        secretKey: clientSecret
  flowable:
    dockerAuthSecret: flowable-flowable-regcred
    database:
      username: flowable
  prometheus:
    enabled: false
    monitoring:
      enabled: true
      global:
        namespace: flowable
