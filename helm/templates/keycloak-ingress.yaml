{{- if .Values.keycloak.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"      
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host:
      http:
        paths:
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 443
{{- end }}